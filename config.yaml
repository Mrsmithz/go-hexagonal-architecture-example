kafka:
  enabled: false
  brokers:
    - 127.0.0.1:29092
  group_id: go-backend-consumer
  auth: none
  allow_insecure: true
  tls:
    enabled: false
    ca_file: ""
    server_name: ""
topics:
  - name: greetings
    consumers: 1
batch_size: 50
processing_concurrency: 10
batch_timeout: 30s
commit_timeout: 10s
